name: Compilar APK Android debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    if: github.ref == 'refs/heads/dev-jerez'
    runs-on: ubuntu-latest

    steps:
      - name: Obtener dev-jerez
        uses: actions/checkout@v4
        with:
          ref: dev-jerez

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'

      - name: Obtener dependencias declaradas
        run: flutter pub get

      - name: Compilar APK debug
        run: flutter build apk --debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
